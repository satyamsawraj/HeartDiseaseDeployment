<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>
    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            text-align:center;
        }

        .container{
            width:450px;
            margin:auto;
            margin-top:30px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:5px;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            color:darkblue;
        }

        h3{
            color:red;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Heart Disease Prediction</h2>

<form action="/predict" method="post">

<input type="number" name="age" placeholder="Age" required>

<input type="number" name="sex" placeholder="Sex (0/1)" required>

<input type="number" name="cp" placeholder="Chest Pain Type" required>

<input type="number" name="trestbps" placeholder="Resting Blood Pressure" required>

<input type="number" name="chol" placeholder="Cholesterol" required>

<input type="number" name="fbs" placeholder="Fasting Blood Sugar" required>

<input type="number" name="restecg" placeholder="Rest ECG" required>

<input type="number" name="thalach" placeholder="Maximum Heart Rate" required>

<input type="number" name="exang" placeholder="Exercise Angina" required>

<input type="text" name="oldpeak" placeholder="Old Peak" required>

<input type="number" name="slope" placeholder="Slope" required>

<input type="number" name="ca" placeholder="CA" required>

<input type="number" name="thal" placeholder="Thal" required>

<br><br>

<button type="submit">Predict</button>

</form>

{% if prediction %}

<h3>{{ prediction }}</h3>

{% endif %}

</div>

</body>

</html>
